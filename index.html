<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple of Fortune</title>
    <script src="https://telegram.org"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #090d12, #040608); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px; overflow: hidden; -webkit-user-select: none; user-select: none; }
        .header-panel { width: 100%; max-width: 400px; display: flex; justify-content: space-between; background: rgba(255,255,255,0.02); padding: 12px 16px; border-radius: 12px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.04); font-size: 15px; }
        .balance { color: #2ecc71; font-weight: bold; text-shadow: 0 0 10px rgba(46,204,113,0.4); }
        
        /* Главное изменение: сетка растягивается на весь свободный экран в высоту */
        .grid { display: grid; grid-template-rows: repeat(10, 1fr); gap: 6px; width: 100%; max-width: 400px; flex-grow: 1; margin: 10px 0; min-height: 0; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; opacity: 0.15; transition: all 0.3s ease; position: relative; height: 100%; }
        .row.active { opacity: 1; }
        
        .cell { height: 100%; background: #111a24; border: 1px solid #1c2a38; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .cell.flipped { transform: rotateY(180deg); }
        .cell .front, .cell .back { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; border-radius: 7px; }
        .cell .front { background: #152230; border: 1px solid #203347; }
        .row.active .cell .front { border-color: #3498db; box-shadow: 0 0 8px rgba(52,152,219,0.3); }
        .cell .back { transform: rotateY(180deg); }
        
        .cell.win { background: #0f3d26 !important; border-color: #2ecc71; box-shadow: 0 0 12px rgba(46,204,113,0.3); }
        .cell.lose { background: #3d0f0f !important; border-color: #e74c3c; box-shadow: 0 0 12px rgba(231,76,60,0.3); }
        
        .controls { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
        input { padding: 14px; border-radius: 12px; border: 1px solid #203347; background: #080f16; color: white; font-size: 16px; text-align: center; outline: none; font-weight: bold; transition: border 0.3s; }
        input:focus { border-color: #3498db; }
        
        /* Кнопки с неоновым неоновым свечением */
        button { padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-play { background: #2ecc71; color: white; box-shadow: 0 0 15px rgba(46,204,113,0.4); }
        .btn-play:active { transform: scale(0.98); box-shadow: 0 0 5px rgba(46,204,113,0.4); }
        .btn-cashout { background: #f1c40f; color: #111; display: none; box-shadow: 0 0 15px rgba(241,196,15,0.4); }
        .btn-cashout:active { transform: scale(0.98); box-shadow: 0 0 5px rgba(241,196,15,0.4); }
        .btn-bonus { background: #3498db; color: white; box-shadow: 0 0 15px rgba(52,152,219,0.3); }
        .btn-bonus:active { transform: scale(0.98); box-shadow: 0 0 5px rgba(52,152,219,0.3); }
        
        .row-info { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #52667a; font-weight: bold; z-index: 10; pointer-events: none; background: rgba(9,13,18,0.7); padding: 2px 4px; border-radius: 4px; }
        #toast { position: fixed; top: -60px; left: 50%; transform: translateX(-50%); background: #2f3542; color: #fff; padding: 12px 24px; border-radius: 30px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        #toast.show { top: 20px; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 20%, 60% {transform: translateX(-6px);} 40%, 80% {transform: translateX(6px);} }
    </style>
</head>
<body>

    <div id="toast">Уведомление</div>

    <div class="header-panel">
        <span>🍏 Баланс: <span class="balance" id="user-balance">$500.00</span></span>
        <span style="color: #52667a; font-weight: bold;">Мин: $10</span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="controls">
        <input type="number" id="bet-amount" value="10" min="10">
        <button class="btn-play" id="btn-action" onclick="startGame()">Сделать ставку</button>
        <button class="btn-cashout" id="btn-cashout" onclick="cashoutGame()">Забрать выигрыш</button>
        <button class="btn-bonus" id="btn-bonus" onclick="getBonus()">🎁 Бонус раз в час</button>
    </div>
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg && typeof tg.expand === 'function') tg.expand();

        const multipliers = [1.23, 1.54, 1.93, 2.41, 3.02, 4.02, 5.37, 7.16, 9.55, 14.33];
        let currentRow = 0, gameRunning = false, gameField = [], currentBet = 10;
        let wallet = 500.0;
        let lastBonusTime = null;

        // Инициализация аудио-движка (как в Сити-Дропере)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioContext ? new AudioContext() : null;

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'apple') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // Нота До
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // Нота Ми
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); // Нота Соль
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'cashout') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1174.66, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        function showToast(text, isDanger = false) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.style.background = isDanger ? '#e74c3c' : '#2ecc71';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function loadLocalData() {
            const savedWallet = localStorage.getItem('apple_game_wallet');
            const savedBonus = localStorage.getItem('apple_game_last_bonus');
            if (savedWallet !== null) wallet = parseFloat(savedWallet);
            if (savedBonus !== null) lastBonusTime = savedBonus;
            updateUI();
        }

        function saveLocalData() {
            localStorage.setItem('apple_game_wallet', wallet);
            if (lastBonusTime) localStorage.setItem('apple_game_last_bonus', lastBonusTime);
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = `$${wallet.toFixed(2)}`;
        }

        function generateField() {
            let field = [];
            for (let row = 0; row < 10; row++) {
                let bad = row < 5 ? 1 : (row < 7 ? 2 : (row < 9 ? 3 : 4));
                let line = Array(bad).fill(0).concat(Array(5 - bad).fill(1));
                line.sort(() => Math.random() - 0.5);
                field.push(line);
            }
            return field;
        }

        function buildField() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (let r = 9; r >= 0; r--) {
                const row = document.createElement('div');
                row.className = `row r-${r}`;
                row.innerHTML = `<div class="row-info">x${multipliers[r]}</div>`;
                const cellsWrap = document.createElement('div');
                cellsWrap.style = 'display:grid; grid-template-columns:repeat(5,1fr); gap:6px; height:100%; width:100%;';

                for (let c = 0; c < 5; c++) {
                    cellsWrap.innerHTML += `
                        <div class="cell" id="c-${r}-${c}" onclick="step(${r}, ${c})">
                            <div class="front"></div>
                            <div class="back" id="b-${r}-${c}"></div>
                        </div>
                    `;
                }
                row.appendChild(cellsWrap);
                grid.appendChild(row);
            }
        }

        function startGame() {
            if(gameRunning) return;
            currentBet = parseFloat(document.getElementById('bet-amount').value);
            if(currentBet < 10 || isNaN(currentBet)) return showToast('Минимальная ставка $10', true);
            if(currentBet > wallet) return showToast('Недостаточно баланса!', true);
            
            playSound('click');
            wallet -= currentBet;
            saveLocalData();
            updateUI();

            gameRunning = true;
            currentRow = 0;
            gameField = generateField();
            buildField();
            highlightRow();
            
            document.getElementById('btn-action').style.display = 'none';
            document.getElementById('btn-bonus').style.display = 'none';
            document.getElementById('bet-amount').disabled = true;
        }

        function highlightRow() {
            document.querySelectorAll('.row').forEach(el => el.classList.remove('active'));
            const activeRow = document.querySelector(`.r-${currentRow}`);
            if(activeRow) activeRow.classList.add('active');
        }

        function step(r, c) {
            if(!gameRunning || r !== currentRow) return;
            
            const cell = document.getElementById(`c-${r}-${c}`);
            const back = document.getElementById(`b-${r}-${c}`);
            cell.classList.add('flipped');

            if(gameField[r][c] === 1) {
                playSound('apple');
                back.innerHTML = '🍏';
                cell.classList.add('win');
                let currentWin = currentBet * multipliers[r];
                document.getElementById('btn-cashout').style.display = 'block';
                document.getElementById('btn-cashout').innerText = `Забрать $${currentWin.toFixed(2)}`;
                
                if(currentRow === 9) {
                    showToast('👑 ПОБЕДА! Карта пройдена!');
                    wallet += currentWin;
                    setTimeout(endGameUI, 1500);
                } else {
                    currentRow++;
                    highlightRow();
                }
            } else {
                playSound('lose');
                back.innerHTML = '❌';
                cell.classList.add('lose');
                document.body.style.animation = "shake 0.3s";
                setTimeout(() => document.body.style.animation = "", 300);
                showToast('💥 Огрызок! Вы проиграли.', true);
                setTimeout(endGameUI, 1500);
            }
        }

        function cashoutGame() {
            if(!gameRunning || currentRow === 0) return;
            playSound('cashout');
            let finalWin = currentBet * multipliers[currentRow - 1];
            wallet += finalWin;
            showToast(`💰 Вы забрали $${finalWin.toFixed(2)}`);
            endGameUI();
        }

        function getBonus() {
            if (wallet >= 10) return showToast('Бонус доступен только при балансе ниже $10!', true);
            
            const now = new Date();
            if (lastBonusTime) {
                const passed = now - new Date(lastBonusTime);
                if (passed < 3600000) { 
                    const leftMins = Math.ceil((3600000 - passed) / 60000);
                    return showToast(`⏳ Подождите еще ${leftMins} мин.`, true);
                }
            }
            
            playSound('cashout');
            const randomBonus = Math.floor(Math.random() * (500 - 10 + 1)) + 10;
            wallet += randomBonus;
            lastBonusTime = now.toISOString();
            showToast(`🎲 Получен бонус: +$${randomBonus}`);
            endGameUI();
        }

        function endGameUI() {
            gameRunning = false;
            document.getElementById('btn-action').style.display = 'block';
            document.getElementById('btn-bonus').style.display = 'block';
            document.getElementById('btn-cashout').style.display = 'none';
            document.getElementById('bet-amount').disabled = false;
            saveLocalData();
            updateUI();
            buildField();
        }

        const shakeStyle = document.createElement('style');
        shakeStyle.innerHTML = `@keyframes shake { 0%, 100% {transform: translateX(0);} 20%, 60% {transform: translateX(-6px);} 40%, 80% {transform: translateX(6px);} }`;
        document.head.appendChild(shakeStyle);

        loadLocalData();
        buildField();
    </script>
</body>
</html>
